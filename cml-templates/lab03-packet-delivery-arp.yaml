lab:
  title: 'CCNA Lab 03: Packet Delivery & ARP Resolution'
  description: 'Vol 1 Ch 3: Local vs Remote Subnet Routing & Layer 2 ARP Resolution
    (Hierarchical Layout)'
  notes: "# CCNA Exam Lab: Packet Delivery & ARP Resolution\n**Exam Blueprint**: CCNA\
    \ 200-301 v1.1 Domains 1.1, 1.3 & 3.1\n**Focus**: Cisco Press OCG Vol 1, Chapter\
    \ 3\n\n---\n## \U0001F3E2 Scenario & Network Topology\nYou are configuring inter-subnet\
    \ routing on router `R1` connecting two enterprise departmental subnets (Subnet\
    \ A and Subnet B). You must configure the router interfaces to act as default\
    \ gateways and analyze the Layer 2 ARP resolution and MAC address rewrite process.\n\
    \n### Addressing Table\n| Device | Interface | IPv4 Address | Subnet Mask | Default\
    \ Gateway |\n| :--- | :--- | :--- | :--- | :--- |\n| **PC1** | `eth0` | `10.1.1.10`\
    \ | `255.255.255.0` | `10.1.1.1` |\n| **R1** | `Gi0/1` | `10.1.1.1` | `255.255.255.0`\
    \ | N/A (Gateway for Subnet A) |\n| **R1** | `Gi0/2` | `10.1.2.1` | `255.255.255.0`\
    \ | N/A (Gateway for Subnet B) |\n| **PC2** | `eth0` | `10.1.2.20` | `255.255.255.0`\
    \ | `10.1.2.1` |\n\n---\n## \U0001F4CB Exam Tasks & Technical Requirements\n1.\
    \ **Router Gateway Configuration**:\n   - Configure `R1` interface `GigabitEthernet0/1`\
    \ with the IP address and subnet mask designated for Subnet A. Ensure the interface\
    \ is administratively enabled.\n   - Configure `R1` interface `GigabitEthernet0/2`\
    \ with the IP address and subnet mask designated for Subnet B. Ensure the interface\
    \ is administratively enabled.\n2. **Console Hygiene**:\n   - On `R1`, configure\
    \ `line console 0` for synchronous logging and disable console session timeouts.\n\
    3. **End-to-End Delivery Verification**:\n   - From `PC1`, test end-to-end IP\
    \ reachability to `PC2` (`10.1.2.20`).\n4. **ARP Resolution & MAC Rewrite Analysis**:\n\
    \   - Inspect the ARP table on `PC1`. Confirm whether PC1 resolves the MAC address\
    \ of the default gateway (`10.1.1.1`) or `PC2` (`10.1.2.20`), and justify why\
    \ based on subnet masking.\n   - Inspect the ARP table on `R1` to confirm learned\
    \ Layer 2 mappings for both endpoints.\n\n---\n## \U0001F50D Success & Verification\
    \ Criteria\n- `show ip interface brief` on `R1` shows both `Gi0/1` and `Gi0/2`\
    \ in `up/up` status.\n- Ping from `PC1` to `PC2` succeeds with a 100% success\
    \ rate.\n- ARP cache on `PC1` contains the Layer 2 MAC address of `R1`'s `Gi0/1`\
    \ interface.\n- *Need a hint? Check the interactive workbook in `~/ccna-study/labs/lab03-packet-delivery-arp.html`.*"
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: -120
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nline con 0\n logging synchronous\n exec-timeout 0 0\nend\n"
- id: n1
  label: PC1
  node_definition: alpine
  x: -220
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
- id: n2
  label: PC2
  node_definition: alpine
  x: 220
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
links:
- id: l0
  n1: n1
  n2: n0
  i1: i0
  i2: i2
  label: PC1-eth0<->R1-Gi0/1
- id: l1
  n1: n2
  n2: n0
  i1: i0
  i2: i3
  label: PC2-eth0<->R1-Gi0/2
annotations: []
smart_annotations: []
