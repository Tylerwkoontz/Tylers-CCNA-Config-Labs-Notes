lab:
  title: 'CCNA Lab 07: Switch Interfaces & MAC Table'
  description: 'Vol 1 Ch 5 & 7: Inter-Switch Trunks & MAC Table (Hierarchical Layout)'
  notes: "# CCNA Exam Lab: Switch Interface Optimization & MAC Address Table\n**Exam\
    \ Blueprint**: CCNA 200-301 v1.1 Domains 1.1, 2.1 & 2.4\n**Focus**: Cisco Press\
    \ OCG Vol 1, Chapters 5 & 7\n\n---\n## \U0001F3E2 Scenario & Network Topology\n\
    You are commissioning the inter-switch link and access ports connecting access\
    \ switches `SW1` and `SW2`. You must optimize interface settings, verify dynamic\
    \ MAC learning behavior, and configure static MAC table security entries.\n\n\
    ### Topology & MAC Mapping\n| Device | Interface | IPv4 Address | MAC Address\
    \ | Connected To |\n| :--- | :--- | :--- | :--- | :--- |\n| **PC-A** | `eth0`\
    \ | `10.1.1.10/24` | `0200.0000.0001` | `SW1 Gi0/2` |\n| **SW1** | `Gi0/1` | N/A\
    \ | N/A | `SW2 Gi0/1` (Inter-Switch Link) |\n| **SW2** | `Gi0/2` | N/A | N/A |\
    \ `PC-B eth0` |\n| **PC-B** | `eth0` | `10.1.1.20/24` | `0200.0000.0002` | `SW2\
    \ Gi0/2` |\n\n---\n## \U0001F4CB Exam Tasks & Technical Requirements\n1. **Interface\
    \ Descriptions & Port Optimization**:\n   - On `SW1` and `SW2`, configure meaningful\
    \ interface descriptions for `Gi0/1` and `Gi0/2`.\n   - On the inter-switch link\
    \ (`Gi0/1`), lock the port speed to 1000 Mbps and set duplex to full on both switches.\n\
    2. **Dynamic MAC Learning**:\n   - Generate ICMP traffic between `PC-A` and `PC-B`\
    \ to trigger Layer 2 frame forwarding.\n   - Inspect the dynamic MAC address tables\
    \ on `SW1` and `SW2`. Identify the learned MAC address, associated VLAN, and egress\
    \ interface for each device.\n3. **Static MAC Security Mapping**:\n   - On `SW1`,\
    \ configure a permanent static MAC address table entry mapping `PC-A`'s MAC address\
    \ (`0200.0000.0001`) to interface `GigabitEthernet0/2` on VLAN 1.\n4. **MAC Table\
    \ Verification**:\n   - Display the total count and composition (dynamic vs. static)\
    \ of entries in the MAC address table.\n\n---\n## \U0001F50D Success & Verification\
    \ Criteria\n- `show interfaces status` shows `1000` speed and `full` duplex on\
    \ `Gi0/1`.\n- `show mac address-table dynamic` displays learned entries for `PC-A`\
    \ and `PC-B`.\n- `show mac address-table static` lists the permanent entry on\
    \ `SW1`.\n- *Need a hint? Check the interactive workbook in `~/ccna-study/labs/lab07-switch-interfaces-mac-table.html`.*"
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
nodes:
- id: n0
  label: SW1
  node_definition: iosvl2
  x: -180
  y: -120
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  configuration:
  - name: ios_config.txt
    content: "hostname SW1\nline con 0\n logging synchronous\n exec-timeout 0 0\n\
      end\n"
- id: n1
  label: SW2
  node_definition: iosvl2
  x: 180
  y: -120
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet0/2
    type: physical
    slot: 2
  configuration:
  - name: ios_config.txt
    content: "hostname SW2\nline con 0\n logging synchronous\n exec-timeout 0 0\n\
      end\n"
- id: n2
  label: PC-A
  node_definition: alpine
  x: -180
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
- id: n3
  label: PC-B
  node_definition: alpine
  x: 180
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
links:
- id: l0
  n1: n0
  n2: n1
  i1: i2
  i2: i2
  label: SW1-Gi0/1<->SW2-Gi0/1
- id: l1
  n1: n2
  n2: n0
  i1: i0
  i2: i3
  label: PC-A-eth0<->SW1-Gi0/2
- id: l2
  n1: n3
  n2: n1
  i1: i0
  i2: i3
  label: PC-B-eth0<->SW2-Gi0/2
