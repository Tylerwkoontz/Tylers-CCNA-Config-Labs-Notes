lab:
  title: 'CCNA Lab 01: TCP/IP Encapsulation & Headers'
  description: 'Vol 1 Ch 1 & 2: 5-Layer Encapsulation, TCP 3-Way Handshake, IPv4 &
    Ethernet Framing (Hierarchical Layout)'
  notes: "# CCNA Exam Lab: TCP/IP Encapsulation & Header Analysis\n**Exam Blueprint**:\
    \ CCNA 200-301 v1.1 Domains 1.1, 1.3 & 1.4\n**Focus**: Cisco Press OCG Vol 1,\
    \ Chapters 1 & 2\n\n---\n## \U0001F3E2 Scenario & Network Topology\nYou are a\
    \ network engineer analyzing end-to-end packet delivery between a client workstation\
    \ and an internal web server. You must verify application reachability, trace\
    \ the transport-layer connection lifecycle, and inspect Layer 2/3 headers.\n\n\
    ### Addressing & Service Specification\n| Device | Interface | IPv4 Address |\
    \ Subnet Mask | Role / Port |\n| :--- | :--- | :--- | :--- | :--- |\n| **Web-Server**\
    \ | `eth0` | `10.1.1.100` | `255.255.255.0` | HTTP Web Server (TCP Port 80) |\n\
    | **PC-Client** | `eth0` | `10.1.1.10` | `255.255.255.0` | Client Workstation\
    \ (MAC: 5000.0001.0001) |\n\n---\n## \U0001F4CB Exam Tasks & Technical Requirements\n\
    1. **Service Verification**: On `Web-Server`, verify that the HTTP daemon is actively\
    \ listening on TCP port 80.\n2. **Packet Capture Initiation**: On `PC-Client`,\
    \ start a packet capture filtered specifically for TCP port 80 traffic.\n3. **HTTP\
    \ Transaction**: From `PC-Client`, issue an HTTP request to `Web-Server` to fetch\
    \ the index web page.\n4. **Transport Layer Handshake Analysis**: Analyze the\
    \ captured packets and identify the 3-Way Handshake sequence:\n   - Identify the\
    \ packet initiating the connection with the `SYN` control flag set.\n   - Identify\
    \ the server's acknowledgement packet with `SYN` and `ACK` flags set.\n   - Identify\
    \ the client's final handshake packet with the `ACK` flag set.\n5. **Header Deconstruction**:\n\
    \   - Verify the Protocol field value in the IPv4 header identifying the encapsulated\
    \ Layer 4 protocol.\n   - Verify the EtherType field value in the Ethernet II\
    \ frame identifying the encapsulated Layer 3 protocol.\n\n---\n## \U0001F50D Success\
    \ & Verification Criteria\n- `PC-Client` successfully receives an HTTP 200 response\
    \ from `Web-Server`.\n- Packet capture confirms the 3-Way Handshake flags and\
    \ proper EtherType / IP Protocol values.\n- *Need a hint? Check the interactive\
    \ workbook in `~/ccna-study/labs/lab01-tcp-ip-encapsulation.html`.*"
