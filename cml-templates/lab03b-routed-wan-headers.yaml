lab:
  title: 'CCNA Lab 03B: Multi-Hop Routed WAN & Framing'
  description: 'Vol 1 Ch 3: Multi-Hop Routing & WAN Framing (Hierarchical Layout)'
  notes: "# CCNA Exam Lab: Multi-Hop Routed WAN & Layer 2 Framing\n**Exam Blueprint**:\
    \ CCNA 200-301 v1.1 Domains 1.1, 1.2 & 3.1\n**Focus**: Cisco Press OCG Vol 1,\
    \ Chapter 3\n\n---\n## \U0001F3E2 Scenario & Network Topology\nYou are deploying\
    \ a multi-hop routed network connecting Site A and Site B across a dedicated point-to-point\
    \ WAN link between routers `R1` and `R2`.\n\n### Addressing Table\n| Device |\
    \ Interface | IPv4 Address | Subnet Mask | Description / Role |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| **PC1** | `eth0` | `10.1.1.10` | `255.255.255.0` |\
    \ Site A Host (Gateway: `10.1.1.1`) |\n| **R1** | `Gi0/1` | `10.1.1.1` | `255.255.255.0`\
    \ | Site A LAN Gateway |\n| **R1** | `Gi0/0` | `10.1.12.1` | `255.255.255.252`\
    \ | WAN Link to R2 |\n| **R2** | `Gi0/0` | `10.1.12.2` | `255.255.255.252` | WAN\
    \ Link to R1 |\n| **R2** | `Gi0/1` | `10.1.2.1` | `255.255.255.0` | Site B LAN\
    \ Gateway |\n| **PC2** | `eth0` | `10.1.2.20` | `255.255.255.0` | Site B Host\
    \ (Gateway: `10.1.2.1`) |\n\n---\n## \U0001F4CB Exam Tasks & Technical Requirements\n\
    1. **Interface Provisioning**:\n   - On `R1` and `R2`, configure IP addresses,\
    \ subnet masks, and interface descriptions on all LAN and WAN interfaces as specified\
    \ in the addressing table. Bring all interfaces up.\n2. **Static Route Configuration**:\n\
    \   - On `R1`, configure a static IPv4 route to reach the Site B LAN subnet (`10.1.2.0/24`)\
    \ using `R2`'s WAN interface IP as the next-hop.\n   - On `R2`, configure a static\
    \ IPv4 route to reach the Site A LAN subnet (`10.1.1.0/24`) using `R1`'s WAN interface\
    \ IP as the next-hop.\n3. **Multi-Hop Path Verification**:\n   - From `PC1`, perform\
    \ a traceroute to `PC2` (`10.1.2.20`) to verify the multi-hop forwarding path\
    \ and observe TTL decrement.\n\n---\n## \U0001F50D Success & Verification Criteria\n\
    - `show ip route static` on `R1` and `R2` confirms the static routes are active\
    \ in the routing table.\n- Ping from `PC1` to `PC2` succeeds.\n- Traceroute from\
    \ `PC1` confirms exactly two intermediate router hops (`10.1.1.1` &rarr; `10.1.12.2`).\n\
    - *Need a hint? Check the interactive workbook in `~/ccna-study/labs/lab03b-routed-wan-headers.html`.*"
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: -180
  y: -120
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nline con 0\n logging synchronous\n exec-timeout 0 0\nend\n"
- id: n1
  label: R2
  node_definition: iosv
  x: 180
  y: -120
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet0/1
    type: physical
    slot: 1
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nline con 0\n logging synchronous\n exec-timeout 0 0\nend\n"
- id: n2
  label: PC1
  node_definition: alpine
  x: -180
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
- id: n3
  label: PC2
  node_definition: alpine
  x: 180
  y: 120
  interfaces:
  - id: i0
    label: eth0
    type: physical
    slot: 0
links:
- id: l0
  n1: n2
  n2: n0
  i1: i0
  i2: i2
  label: PC1-eth0<->R1-Gi0/1
- id: l1
  n1: n0
  n2: n1
  i1: i1
  i2: i1
  label: R1-Gi0/0<->R2-Gi0/0
- id: l2
  n1: n3
  n2: n1
  i1: i0
  i2: i2
  label: PC2-eth0<->R2-Gi0/1
annotations: []
smart_annotations: []
