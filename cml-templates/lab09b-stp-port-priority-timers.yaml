lab:
  title: 'CCNA Lab 09B: STP Parallel Links & Timer Tuning'
  description: 'Vol 1 Ch 9: Spanning Tree Protocol (STP) Port Priority, Sender Port ID & Convergence Timers'
  notes: "# CCNA Exam Lab: STP Parallel Links, Port Priority & Convergence Timers\n**Exam Blueprint**: CCNA 200-301 v1.1 Domain 2.5 (Spanning Tree Operations)\n**Primary Focus**: Cisco Press OCG Vol 1, Chapter 9 (\"Spanning Tree Protocol Concepts\" - Tiebreakers & Timers)\n\n---\n## 🏢 Scenario & Network Topology\nYou are testing Layer 2 redundancy and STP convergence across dual parallel GigabitEthernet links between distribution switch `SW1` and access switch `SW2`. `SW1` is the Root Bridge.\n\nBecause both parallel links have identical root path costs (4) and identical sender bridge IDs, `SW2` must execute the final tiebreaker: lowest sender port priority and port ID from `SW1`. By default, `SW2` puts interface `Gi0/2` into the Alternate/Blocking state because `SW1` advertises Port ID `128.2` on `Gi0/1` and `128.3` on `Gi0/2`.\n\nYour task is to analyze the tiebreaker mechanics, manipulate sender port priority on `SW1` to switch the active forwarding link without modifying cost, and analyze/tune STP convergence timers (Hello, MaxAge, Forward Delay).\n\n### Topology & Interconnections\n| Device | Interface | Connected To | Default Role | Target Role |\n| :--- | :--- | :--- | :--- | :--- |\n| **SW1** | `Gi0/1` | `SW2 Gi0/1` | Designated (FWD) | Designated (FWD) |\n| **SW1** | `Gi0/2` | `SW2 Gi0/2` | Designated (FWD) | Designated (FWD) |\n| **SW1** | `Gi0/3` | `PC-A eth0` | Designated (FWD) | Designated (FWD) |\n| **SW2** | `Gi0/1` | `SW1 Gi0/1` | Root Port (FWD) | Alternate Port (BLK) |\n| **SW2** | `Gi0/2` | `SW1 Gi0/2` | Alternate Port (BLK) | Root Port (FWD) |\n| **SW2** | `Gi0/3` | `PC-B eth0` | Designated (FWD) | Designated (FWD) |\n\n---\n## 📋 Exam Tasks & Technical Requirements\n1. **Baseline Root Bridge Setup**:\n   - Set hostnames `SW1` and `SW2`.\n   - Configure `SW1` as the Root Bridge for VLAN 1 (`spanning-tree vlan 1 priority 4096`).\n   - Leave `SW2` at default priority (`32768`).\n2. **Parallel Link Tiebreaker Analysis**:\n   - Inspect `show spanning-tree vlan 1` and `show spanning-tree detail` on `SW2`.\n   - Confirm `SW2 Gi0/1` is `Root FWD` and `SW2 Gi0/2` is `Altn BLK` (or `DISC`).\n   - Identify the neighbor Designated Port ID (`128.2` vs `128.3`) received in BPDUs.\n3. **Sender Port Priority Manipulation**:\n   - On `SW1`, modify the Spanning Tree port priority on interface `Gi0/2` to `64` (default is 128).\n   - Verify on `SW2` that `Gi0/2` immediately transitions to `Root FWD` and `Gi0/1` becomes `Altn BLK`.\n4. **STP Timer Tuning & Diagnostics**:\n   - On `SW1` (Root Bridge), tune STP timers for VLAN 1:\n     - Hello Time: `2` seconds\n     - Forward Delay: `10` seconds (default 15)\n     - Max Age: `14` seconds (default 20)\n   - Verify on both `SW1` and `SW2` that non-root switches adopt the Root Bridge's advertised timers via BPDUs.\n\n---\n## 🔍 Success & Verification Criteria\n- `show spanning-tree vlan 1` on `SW2` confirms `Gi0/2` is the Root Port.\n- `show spanning-tree vlan 1` on `SW2` shows updated timers (Hello 2, Max Age 14, Fwd Delay 10).\n- *Need a hint or deep-dive? Check the interactive workbook in `~/ccna-study/labs/lab09b-stp-port-priority-timers.html`.*"
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
