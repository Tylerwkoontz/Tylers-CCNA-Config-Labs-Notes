lab:
  title: 'CCNA Lab 09: Classic STP Root Election & Path Cost'
  description: 'Vol 1 Ch 9: Spanning Tree Protocol (STP) Bridge ID, Root Election & Path Cost Tuning'
  notes: "# CCNA Exam Lab: Spanning Tree Protocol Root Election & Path Cost\n**Exam Blueprint**: CCNA 200-301 v1.1 Domain 2.5 (Spanning Tree Operations)\n**Primary Focus**: Cisco Press OCG Vol 1, Chapter 9 (\"Spanning Tree Protocol Concepts\")\n\n---\n## 🏢 Scenario & Network Topology\nYou are configuring a redundant switched Layer 2 topology comprising three switches: `SW1`, `SW2`, and `SW3`. By default, all switches run IEEE 802.1D Spanning Tree with equal priority (32768 + VLAN 1 = 32769), causing the switch with the lowest base MAC address to become the Root Bridge unpredictably.\n\nYour task is to take control of the STP topology: designate `SW1` as the Primary Root Bridge and `SW2` as the Secondary Root Bridge, determine port roles (Root Port, Designated Port, Alternate/Blocking Port), and manipulate interface path costs on `SW3` to force deterministic Layer 2 traffic paths.\n\n### Topology & Interconnections\n| Device | Interface | Connected To | Role in Target State |\n| :--- | :--- | :--- | :--- |\n| **SW1** | `Gi0/1` | `SW2 Gi0/1` | Designated Port (Forwarding) |\n| **SW1** | `Gi0/2` | `SW3 Gi0/1` | Designated Port (Forwarding) |\n| **SW2** | `Gi0/1` | `SW1 Gi0/1` | Root Port (Forwarding) |\n| **SW2** | `Gi0/3` | `SW3 Gi0/3` | Designated Port (Forwarding) |\n| **SW2** | `Gi0/2` | `PC-A eth0` | Designated Port (Forwarding) |\n| **SW3** | `Gi0/1` | `SW1 Gi0/2` | Root Port (Forwarding) |\n| **SW3** | `Gi0/3` | `SW2 Gi0/3` | Alternate Port (Blocking) |\n| **SW3** | `Gi0/2` | `PC-B eth0` | Designated Port (Forwarding) |\n\n---\n## 📋 Exam Tasks & Technical Requirements\n1. **Base Switch Identification**:\n   - Set hostnames `SW1`, `SW2`, and `SW3`.\n   - Ensure console logging synchronous is active on all switches.\n2. **Deterministic Root Bridge Configuration**:\n   - On `SW1`, configure the bridge priority for VLAN 1 to `4096` (Primary Root).\n   - On `SW2`, configure the bridge priority for VLAN 1 to `8192` (Secondary Root).\n   - Leave `SW3` at default bridge priority (`32768`).\n3. **Root Port & Designated Port Verification**:\n   - Verify on `SW1` that all active ports are Designated (`Desg`) and Forwarding (`FWD`).\n   - Verify on `SW2` and `SW3` which ports are selected as Root Ports (`Root`) with a default Gigabit path cost of `4`.\n   - Verify that link `SW2 Gi0/3` <-> `SW3 Gi0/3` has one Designated Port and one Alternate/Blocking Port.\n4. **Path Cost Manipulation (Traffic Engineering)**:\n   - On `SW3`, increase the Spanning Tree cost of interface `Gi0/1` to `10`.\n   - Observe that `SW3 Gi0/3` (cost 4 to SW2 + 4 to SW1 = total cost 8) now becomes the new Root Port for `SW3`, while `SW3 Gi0/1` (cost 10) becomes Alternate/Blocking.\n\n---\n## 🔍 Success & Verification Criteria\n- `show spanning-tree vlan 1` on `SW1` states: `This bridge is the root`.\n- `show spanning-tree vlan 1` on `SW2` shows `Gi0/1` as Root Port (`Cost 4`).\n- `show spanning-tree vlan 1` on `SW3` reflects the path cost change and updated Root Port.\n- *Need a hint or deep-dive? Check the interactive workbook in `~/ccna-study/labs/lab09-stp-root-election-path-cost.html`.*"
  version: 0.3.1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
