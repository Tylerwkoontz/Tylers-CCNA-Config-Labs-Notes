site_name: "Tyler's CCNA Lab Hub & Study Notes (Internal)"
site_description: Private CCNA study notes, Wendell Odom Cert Guide breakdowns, and interactive CML lab workbooks.
site_author: Tyler Koontz

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/lab-styles.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 00. Exam Blueprint:
      - Overview: 00-exam-blueprint/index.md
      - 1.0 Network Fundamentals: 00-exam-blueprint/1.0-network-fundamentals.md
      - 2.0 Network Access: 00-exam-blueprint/2.0-network-access.md
      - 3.0 IP Connectivity: 00-exam-blueprint/3.0-ip-connectivity.md
      - 4.0 IP Services: 00-exam-blueprint/4.0-ip-services.md
      - 5.0 Security Fundamentals: 00-exam-blueprint/5.0-security-fundamentals.md
      - 6.0 Automation & Programmability: 00-exam-blueprint/6.0-automation.md
  - 01. Cert Guide Notes:
      - Overview: 01-cert-guide-notes/index.md
      - Chapter 09 - Subnetting & IPv4 Routing: 01-cert-guide-notes/ch09-subnetting-and-routing.md
  - 02. CML Labs:
      - Lab Catalog & Dashboard: 02-cml-labs/index.md
      - Published Workbooks:
          - Lab 09 - Multi-Subnet IPv4 Routing: 02-cml-labs/published/lab09-multi-subnet-routing.md
          - Master Lab Template: 02-cml-labs/published/template-lab-guide.md
      - Lab Drafts & Scratchpad: 02-cml-labs/drafts/index.md
  - 03. Troubleshooting Drills:
      - Overview: 03-troubleshooting-drills/index.md
  - 04. Quizzes & Drills:
      - Subnetting Speed Drills: 04-quizzes-and-flashcards/subnetting-drills.md
      - Chapter 09 DIKTA Quiz: 04-quizzes-and-flashcards/ch09-dikta-quiz.md
  - 05. Lessons Learned:
      - Study Log & Gotchas: 05-lessons-learned/index.md
  - 06. Content Ideas & Lab Blueprints:
      - Future Lab Videos & Blog Ideas: 06-content-pipeline/index.md
